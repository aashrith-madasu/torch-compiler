[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triton_kernel_generation"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
]

[tool.setuptools]
packages = ["fusion"]